<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login </title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="container">

        <div class="login-card">

            <h1>Welcome Back</h1>

            <p>
                Sign in to continue to the Travello
            </p>

            <form>

                <label>Email</label>
                <input
                    type="email"
                    placeholder="Enter your email"
                    required
                >

                <label>Password</label>
                <input
                    type="password"
                    placeholder="Enter your password"
                    required
                >

                <div class="remember">

                    <label>
                        <input type="checkbox">
                        Remember Me
                    </label>

                    <a href="forgetpassword.html">Forgot Password?</a>

                </div>

                <button type="submit">
                    Login
                </button>

            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <button class="guest-btn"
                onclick="window.location.href='dashboard.html'">
                Continue as Guest
            </button>

            <p class="signup">
                Don't have an account?
                <a href="signup.html">Sign Up</a>
            </p>

            <p class="home">
                <a href="index.html">← Back to Home</a>
            </p>

        </div>

    </div>

</body>
</html>
